kind = "web"
previewPath = "/"
title = "SeedChain Platform"
version = "1.0.0"
id = "artifacts/seedchain"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23195

[services.development]
run = "pnpm --filter @workspace/seedchain run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seedchain", "run", "build" ]
publicDir = "artifacts/seedchain/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23195"
BASE_PATH = "/"
