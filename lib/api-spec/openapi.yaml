        harvestQuantity: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
        qualityGrade: { $ref: "#/components/schemas/QualityGrade" }
        qualityNotes: { type: string, maxLength: 1000 }
        origin: { type: string, minLength: 2, maxLength: 200 }
        publicNotes: { type: string, maxLength: 1000 }
        privateNotes: { type: string, maxLength: 2000 }
        storage: { $ref: "#/components/schemas/StorageInput" }
        clientEventId: { type: string, format: uuid }
    UpdateLotBody:
