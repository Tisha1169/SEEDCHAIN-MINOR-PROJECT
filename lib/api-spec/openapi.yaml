            qualityGrade: { type: [string, "null"] }
            availableQuantity: { type: [number, "null"] }
            unit: { type: string }
            pricePerUnit: { type: [number, "null"] }
            lastUpdatedAt: { type: string, format: date-time }
            timeline:
              type: array
