      type: object
      required: [lotId, lotCode, productName, variety, status, listed, inventory]
      properties:
        lotId: { type: string, format: uuid }
        lotCode: { type: string }
        productName: { type: string }
        variety: { type: string }
        farmerName: { type: [string, "null"] }
