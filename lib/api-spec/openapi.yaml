openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: |
    SeedChain: direct farmer-to-customer agricultural traceability.
    Three roles only: admin, farmer, customer.
    Authentication uses an httpOnly session cookie. Every non-GET request must
    send the header `X-SeedChain-CSRF: 1`.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: admin
  - name: farms
  - name: products
  - name: lots
  - name: qr
  - name: trace
  - name: marketplace
  - name: orders
  - name: dashboard
  - name: alerts
  - name: external
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ------------------------------------------------------------------ auth
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a farmer (pending admin approval) or a customer (active immediately)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterUserBody" }
      responses:
        "201":
          description: Registered and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginUserBody" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      responses:
        "204": { description: Session revoked }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Error" }
  /me/profile:
    patch:
      operationId: updateMyProfile
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }

  # ------------------------------------------------------------------ admin users
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      parameters:
        - { name: role, in: query, schema: { $ref: "#/components/schemas/UserRole" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/UserStatus" } }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CurrentUser" }
  /admin/users/{id}/{action}:
    post:
      operationId: reviewUser
      tags: [admin]
      summary: Approve / reject a farmer, suspend / reactivate any non-admin user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [approve, reject, suspend, reactivate] }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewUserBody" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Audit log entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }
  /admin/events:
    get:
      operationId: listAllTraceEvents
      tags: [admin]
      parameters:
        - { name: eventType, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Traceability events across all lots (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TraceEvent" }
  /admin/scans:
    get:
      operationId: listQrScans
      tags: [admin]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: QR scans (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QrScan" }

  # ------------------------------------------------------------------ farms / products
  /farms:
    get:
      operationId: listFarms
      tags: [farms]
      responses:
        "200":
          description: Farms visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Farm" }
    post:
      operationId: createFarm
      tags: [farms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
  /farms/{id}:
    patch:
      operationId: updateFarm
      tags: [farms]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
  /products:
    get:
      operationId: listProducts
      tags: [products]
      responses:
        "200":
          description: Products visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }

  # ------------------------------------------------------------------ lots
  /lots:
    get:
      operationId: listLots
      tags: [lots]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/LotStatus" } }
      responses:
        "200":
          description: Lots visible to the caller (farmer = own, admin = all)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LotSummary" }
    post:
      operationId: createLot
      tags: [lots]
      summary: Create a lot, its LOT_CREATED event and its first QR identity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLotBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LotDetail" }
  /lots/{id}:
    get:
      operationId: getLot
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Lot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LotDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateLot
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLotBody" }
      responses:
        "200":
          description: Updated (LOT_UPDATED event appended)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LotDetail" }
  /inventory:
    get:
      operationId: getInventory
      tags: [lots]
      summary: Live inventory per lot with totals (farmer = own lots, admin = all)
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryReport" }
  /lots/{id}/listing:
    post:
      operationId: setLotListing
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LotListingBody" }
      responses:
        "200":
          description: Listing updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LotDetail" }
  /lots/{id}/events:
    get:
      operationId: listLotEvents
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Full (private) event history of the lot, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TraceEvent" }
    post:
      operationId: recordLotEvent
      tags: [lots]
      summary: Farmer records a real-world event. Idempotent on clientEventId.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: X-Offline-Replay
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordLotEventBody" }
      responses:
        "201":
          description: Event appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceEvent" }
        "200":
          description: Duplicate clientEventId, original event returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceEvent" }
        "409": { $ref: "#/components/responses/Error" }
  /lots/{id}/storage:
    get:
      operationId: listLotStorage
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Farmer-managed storage records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StorageRecord" }
  /lots/{id}/qr:
    get:
      operationId: listLotQrCodes
      tags: [qr]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: QR history of the lot (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QrCode" }

  # ------------------------------------------------------------------ qr
  /qr/generate:
    post:
      operationId: generateQr
      tags: [qr]
      summary: Issue a replacement QR for a lot (old ACTIVE QR becomes REPLACED)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateQrBody" }
      responses:
        "201":
          description: New active QR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrCode" }
  /qr/revoke:
    post:
      operationId: revokeQr
      tags: [qr]
      summary: Admin revokes a QR (compromised label). The lot keeps its identity and history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeQrBody" }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrCode" }

  # ------------------------------------------------------------------ public trace
  /trace/{publicToken}:
    get:
      operationId: getPublicTrace
      tags: [trace]
      summary: Public, unauthenticated, rate-limited lot verification
      parameters:
        - { name: publicToken, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Verified lot with public timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTrace" }
        "404": { $ref: "#/components/responses/Error" }
        "410":
          description: QR revoked or replaced; no lot data disclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceUnavailable" }
  /public/overview:
    get:
      operationId: getPublicOverview
      tags: [trace]
      summary: Public landing-page aggregates and one featured public lot (live database values, cached 30 s)
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOverview" }
  /scans:
    post:
      operationId: recordScan
      tags: [trace]
      summary: Record a QR scan (idempotent on clientEventId)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordScanBody" }
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResult" }
  /me/scans:
    get:
      operationId: listMyScans
      tags: [trace]
      responses:
        "200":
          description: Lots recently scanned by the signed-in user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MyScan" }

  # ------------------------------------------------------------------ marketplace
  /marketplace/listings:
    get:
      operationId: listMarketplace
      tags: [marketplace]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200":
          description: Listed lots with available quantity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }
  /marketplace/listings/{lotId}:
    get:
      operationId: getListing
      tags: [marketplace]
      parameters:
        - { name: lotId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404": { $ref: "#/components/responses/Error" }
  /farmers/{id}:
    get:
      operationId: getPublicFarmer
      tags: [marketplace]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Public farmer profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicFarmer" }
        "404": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ orders
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
      responses:
        "200":
          description: Orders visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Customer places an order; inventory is reserved in the same transaction
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "200":
          description: Duplicate Idempotency-Key; existing order returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409": { $ref: "#/components/responses/Error" }
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Order with its event history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/Error" }
  /orders/{id}/{action}:
    post:
      operationId: transitionOrder
      tags: [orders]
      summary: |
        Order state transitions. Farmer: accept, reject, prepare, ready, dispatch, complete.
        Customer: cancel (PENDING/ACCEPTED), confirm-receipt. Admin: cancel, confirm-receipt (with reason).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: action
          in: path
          required: true
          schema: { $ref: "#/components/schemas/OrderAction" }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 100 }
        - name: X-Offline-Replay
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderTransitionBody" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409": { $ref: "#/components/responses/Error" }
  /orders/{id}/feedback:
    post:
      operationId: submitOrderFeedback
      tags: [orders]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackBody" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  # ------------------------------------------------------------------ dashboards
  /dashboard/overview:
    get:
      operationId: getAdminOverview
      tags: [dashboard]
      responses:
        "200":
          description: Admin command-center metrics (live database values)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /dashboard/farmer:
    get:
      operationId: getFarmerOverview
      tags: [dashboard]
      responses:
        "200":
          description: Farmer metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmerOverview" }
  /dashboard/customer:
    get:
      operationId: getCustomerOverview
      tags: [dashboard]
      responses:
        "200":
          description: Customer metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOverview" }

  # ------------------------------------------------------------------ alerts
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [open, all] }
      responses:
        "200":
          description: Alerts (admin = all, farmer = own)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }
  /alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      tags: [alerts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
  /alerts/{id}/resolve:
    post:
      operationId: resolveAlert
      tags: [alerts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }

  # ------------------------------------------------------------------ external data
  /market-prices:
    get:
      operationId: getMarketPrices
      tags: [external]
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90 } }
      responses:
        "200":
          description: Stored external mandi price observations (never fabricated)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketPrices" }
  /weather:
    get:
      operationId: getWeather
      tags: [external]
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Latest stored weather observation for the farm location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherReport" }
  /admin/integrations:
    get:
      operationId: listIntegrations
      tags: [external]
      responses:
        "200":
          description: External data source status and ingestion lineage
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationStatus" }
  /admin/integrations/{source}/run:
    post:
      operationId: runIntegration
      tags: [external]
      parameters:
        - name: source
          in: path
          required: true
          schema: { type: string, enum: [market_prices, weather] }
      responses:
        "200":
          description: Run finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionRun" }

components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details: {}
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    UserRole: { type: string, enum: [admin, farmer, customer] }
    UserStatus: { type: string, enum: [pending, active, rejected, suspended] }
    FarmerProfile:
      type: object
      required: [publicName]
      properties:
        publicName: { type: string }
        bio: { type: [string, "null"] }
        village: { type: [string, "null"] }
        district: { type: [string, "null"] }
        state: { type: [string, "null"] }
        verifiedAt: { type: [string, "null"], format: date-time }
        reviewNote: { type: [string, "null"] }
    CurrentUser:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        location: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        farmerProfile:
          oneOf:
            - $ref: "#/components/schemas/FarmerProfile"
            - type: "null"
    FarmerProfileInput:
      type: object
      required: [publicName]
      additionalProperties: false
      properties:
        publicName: { type: string, minLength: 2, maxLength: 120 }
        bio: { type: string, maxLength: 1000 }
        village: { type: string, maxLength: 120 }
        district: { type: string, maxLength: 120 }
        state: { type: string, maxLength: 120 }
    RegisterUserBody:
      type: object
      required: [name, email, password, role]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 200 }
        role: { type: string, enum: [farmer, customer] }
        phone: { type: string, maxLength: 30 }
        location: { type: string, maxLength: 200 }
