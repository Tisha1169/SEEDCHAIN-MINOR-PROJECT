      type: object
      required: [rating, createdAt]
      properties:
        rating: { type: integer }
        freshnessRating: { type: [integer, "null"] }
        qualityRating: { type: [integer, "null"] }
        comment: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    Order:
      type: object
      required: [id, orderCode, status, fulfillmentMethod, totalAmount, items, customer, farmer, createdAt, updatedAt, allowedActions]
      properties:
        id: { type: string, format: uuid }
        orderCode: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        fulfillmentMethod: { $ref: "#/components/schemas/FulfillmentMethod" }
        totalAmount: { type: number }
        deliveryAddress: { type: [string, "null"] }
        customerNotes: { type: [string, "null"] }
        rejectionReason: { type: [string, "null"] }
        cancelReason: { type: [string, "null"] }
        deliveryLocation: { type: [string, "null"] }
        deliveryNotes: { type: [string, "null"] }
        thirdPartyName: { type: [string, "null"] }
        thirdPartyReference: { type: [string, "null"] }
        acceptedAt: { type: [string, "null"], format: date-time }
        preparedAt: { type: [string, "null"], format: date-time }
        readyAt: { type: [string, "null"], format: date-time }
        dispatchedAt: { type: [string, "null"], format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        customer: { $ref: "#/components/schemas/OrderParty" }
        farmer: { $ref: "#/components/schemas/OrderFarmer" }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        allowedActions:
          type: array
          description: Actions the current caller may perform now (computed by the backend state machine)
          items: { $ref: "#/components/schemas/OrderAction" }
        events:
          type: array
          items: { $ref: "#/components/schemas/TraceEvent" }
        feedback:
          oneOf:
            - $ref: "#/components/schemas/OrderFeedback"
            - type: "null"
    CreateOrderItem:
      type: object
      required: [lotId, quantity]
      additionalProperties: false
      properties:
        lotId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
    CreateOrderBody:
      type: object
      required: [items, fulfillmentMethod]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/CreateOrderItem" }
        fulfillmentMethod: { $ref: "#/components/schemas/FulfillmentMethod" }
        deliveryAddress: { type: string, maxLength: 500 }
        customerNotes: { type: string, maxLength: 1000 }
    OrderTransitionBody:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 1000 }
        eventTime: { type: string, format: date-time }
        deliveryLocation: { type: string, maxLength: 300 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        deliveryNotes: { type: string, maxLength: 1000 }
        thirdPartyName: { type: string, maxLength: 200 }
        thirdPartyReference: { type: string, maxLength: 200 }
        clientEventId: { type: string, format: uuid }
    FeedbackBody:
      type: object
      required: [rating]
      additionalProperties: false
      properties:
        rating: { type: integer, minimum: 1, maximum: 5, description: "Overall" }
        freshnessRating: { type: integer, minimum: 1, maximum: 5 }
        qualityRating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }

    CountPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    FarmerInventoryPoint:
      type: object
      required: [farmer, available, reserved, sold]
      properties:
        farmer: { type: string }
        available: { type: number }
        reserved: { type: number }
        sold: { type: number }
    AdminOverview:
      type: object
      required:
        [totalFarmers, verifiedFarmers, pendingFarmers, totalCustomers, activeLots, availableQuantity, reservedQuantity, soldQuantity,
         lossQuantity, ordersToday, completedOrders, qrScansToday, traceEvents, openAlerts, highRiskLots, lotsByStatus, inventoryByFarmer,
         ordersOverTime, scansOverTime, riskDistribution, lossRatePct, marketTrend, externalFreshness, generatedAt]
      properties:
        totalFarmers: { type: integer }
        verifiedFarmers: { type: integer }
        pendingFarmers: { type: integer }
        totalCustomers: { type: integer }
        activeLots: { type: integer }
        availableQuantity: { type: number }
        reservedQuantity: { type: number }
        soldQuantity: { type: number }
        lossQuantity: { type: number }
        lossRatePct: { type: number }
        ordersToday: { type: integer }
        completedOrders: { type: integer }
        qrScansToday: { type: integer }
        traceEvents: { type: integer }
        openAlerts: { type: integer }
        highRiskLots: { type: integer }
        lotsByStatus: { type: array, items: { $ref: "#/components/schemas/CountPoint" } }
        inventoryByFarmer: { type: array, items: { $ref: "#/components/schemas/FarmerInventoryPoint" } }
        ordersOverTime: { type: array, items: { $ref: "#/components/schemas/CountPoint" } }
        scansOverTime: { type: array, items: { $ref: "#/components/schemas/CountPoint" } }
        riskDistribution: { type: array, items: { $ref: "#/components/schemas/CountPoint" } }
        marketTrend: { type: array, items: { $ref: "#/components/schemas/CountPoint" } }
        externalFreshness: { type: array, items: { $ref: "#/components/schemas/IntegrationStatus" } }
        generatedAt: { type: string, format: date-time }
    FarmerOverview:
      type: object
      required: [farms, products, activeLots, available, reserved, sold, loss, pendingOrders, activeOrders, completedOrders, activeQrCodes, recentEvents, openAlerts, generatedAt]
      properties:
        farms: { type: integer }
        products: { type: integer }
        activeLots: { type: integer }
        available: { type: number }
        reserved: { type: number }
        sold: { type: number }
        loss: { type: number }
        pendingOrders: { type: integer }
        activeOrders: { type: integer }
        completedOrders: { type: integer }
        activeQrCodes: { type: integer }
        openAlerts: { type: integer }
        recentEvents: { type: array, items: { $ref: "#/components/schemas/TraceEvent" } }
        generatedAt: { type: string, format: date-time }
    CustomerOverview:
      type: object
      required: [activeOrders, completedOrders, totalSpent, recentOrders, recentScans, generatedAt]
      properties:
        activeOrders: { type: integer }
        completedOrders: { type: integer }
        totalSpent: { type: number }
        recentOrders: { type: array, items: { $ref: "#/components/schemas/Order" } }
        recentScans: { type: array, items: { $ref: "#/components/schemas/MyScan" } }
        generatedAt: { type: string, format: date-time }

    Alert:
      type: object
      required: [id, type, severity, message, createdAt, metadata]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        entityType: { type: [string, "null"] }
        entityId: { type: [string, "null"] }
        message: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, "null"], format: date-time }
        acknowledgedBy: { type: [string, "null"] }
        resolvedAt: { type: [string, "null"], format: date-time }

    IngestionRun:
      type: object
      required: [id, source, sourceEndpoint, status, recordCount, fetchedCount, rejectedCount, processingVersion, startedAt, requestParams]
      properties:
        id: { type: string, format: uuid }
        fetchedCount: { type: integer }
        rejectedCount: { type: integer }
        source: { type: string }
        sourceEndpoint: { type: string }
        requestParams: { type: object, additionalProperties: true }
        processingVersion: { type: string }
        status: { type: string, enum: [RUNNING, SUCCESS, PARTIAL, FAILED, SKIPPED] }
        recordCount: { type: integer }
        error: { type: [string, "null"] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    SourceInfo:
      type: object
      required: [source, label, organization, url, frequency, dataClass, freshness]
      properties:
        source: { type: string }
        label: { type: string }
        organization: { type: string }
        url: { type: string }
        frequency: { type: string }
        licence: { type: [string, "null"] }
        dataClass: { type: string, enum: [operational_external, historical, reference] }
        freshness: { type: string, enum: [CURRENT, CACHED, STALE, NO_DATA, NOT_INTEGRATED] }
        observationDate: { type: [string, "null"], description: "Latest observation / period the data refers to" }
        lastSyncAt: { type: [string, "null"], format: date-time }
    IntegrationStatus:
      type: object
      required: [source, label, organization, url, dataset, geography, frequency, dataClass, integration, freshness, configured, recentRuns]
      properties:
        source: { type: string }
        label: { type: string }
        organization: { type: string }
        url: { type: string }
        dataset: { type: string }
        geography: { type: string }
        frequency: { type: string }
        units: { type: [string, "null"] }
        licence: { type: [string, "null"] }
        usageNotes: { type: [string, "null"] }
        dataClass: { type: string, enum: [operational_external, historical, reference] }
        integration: { type: string, enum: [automated, file_import, reference_only] }
        integrationNote: { type: [string, "null"] }
        freshness: { type: string, enum: [CURRENT, CACHED, STALE, NO_DATA, NOT_INTEGRATED] }
        observationDate: { type: [string, "null"] }
        lastSyncAt: { type: [string, "null"], format: date-time }
        configured: { type: boolean }
        configurationHint: { type: [string, "null"] }
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/IngestionRun"
            - type: "null"
        lastSuccess:
          oneOf:
            - $ref: "#/components/schemas/IngestionRun"
            - type: "null"
        recentRuns: { type: array, items: { $ref: "#/components/schemas/IngestionRun" } }
    MarketPriceObservation:
      type: object
      required: [id, source, sourceEndpoint, observationDate, retrievedAt, state, market, commodity, priceUnit]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        sourceEndpoint: { type: string }
        observationDate: { type: string }
        retrievedAt: { type: string, format: date-time }
        state: { type: string }
        district: { type: [string, "null"] }
        market: { type: string }
        commodity: { type: string }
        variety: { type: [string, "null"] }
        grade: { type: [string, "null"] }
        arrivalQuantityTonnes: { type: [number, "null"] }
        minPrice: { type: [number, "null"] }
        maxPrice: { type: [number, "null"] }
        modalPrice: { type: [number, "null"] }
        priceUnit: { type: string }
    MarketPrices:
      type: object
      required: [label, observations, status]
      properties:
        label: { type: string }
        observations: { type: array, items: { $ref: "#/components/schemas/MarketPriceObservation" } }
        status: { $ref: "#/components/schemas/IntegrationStatus" }
    WeatherObservation:
      type: object
      required: [source, sourceEndpoint, observationTime, retrievedAt, latitude, longitude]
      properties:
        source: { type: string }
        sourceEndpoint: { type: string }
        observationTime: { type: string, format: date-time }
        retrievedAt: { type: string, format: date-time }
        latitude: { type: number }
        longitude: { type: number }
        temperatureC: { type: [number, "null"] }
        precipitationMm: { type: [number, "null"] }
        humidityPct: { type: [number, "null"] }
        weatherCode: { type: [integer, "null"] }
        condition: { type: [string, "null"] }
    WeatherReport:
      type: object
      required: [farmId, hasCoordinates, status]
      properties:
        farmId: { type: string, format: uuid }
        hasCoordinates: { type: boolean }
        observation:
          oneOf:
            - $ref: "#/components/schemas/WeatherObservation"
            - type: "null"
        status: { $ref: "#/components/schemas/IntegrationStatus" }
