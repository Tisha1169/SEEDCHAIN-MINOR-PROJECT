openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: |
    SeedChain: direct farmer-to-customer agricultural traceability.
    Three roles only: admin, farmer, customer.
    Authentication uses an httpOnly session cookie. Every non-GET request must
    send the header `X-SeedChain-CSRF: 1`.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: admin
  - name: farms
  - name: products
  - name: lots
  - name: qr
  - name: trace
  - name: marketplace
  - name: orders
  - name: dashboard
  - name: alerts
  - name: external
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ------------------------------------------------------------------ auth
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a farmer (pending admin approval) or a customer (active immediately)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterUserBody" }
      responses:
        "201":
          description: Registered and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginUserBody" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      responses:
        "204": { description: Session revoked }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Error" }
  /me/profile:
    patch:
      operationId: updateMyProfile
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }

  # ------------------------------------------------------------------ admin users
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      parameters:
        - { name: role, in: query, schema: { $ref: "#/components/schemas/UserRole" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/UserStatus" } }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CurrentUser" }
  /admin/users/{id}/{action}:
    post:
      operationId: reviewUser
      tags: [admin]
      summary: Approve / reject a farmer, suspend / reactivate any non-admin user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [approve, request-correction, reject, suspend, reactivate] }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewUserBody" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Audit log entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }
  /admin/events:
    get:
      operationId: listAllTraceEvents
      tags: [admin]
      parameters:
        - { name: eventType, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Traceability events across all lots (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TraceEvent" }
  /admin/scans:
    get:
      operationId: listQrScans
      tags: [admin]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: QR scans (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QrScan" }

  /admin/scans/areas:
    get:
      operationId: getScanAreas
      tags: [admin]
      description: Admin only. OK scans that shared a coarse location, grouped into 0.5-degree cells (about 55 km). Never exact points.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365 } }
      responses:
        "200":
          description: Approximate scan areas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanAreas" }

  # ------------------------------------------------------------------ farms / products
  /farms:
    get:
      operationId: listFarms
      tags: [farms]
      responses:
        "200":
          description: Farms visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Farm" }
    post:
      operationId: createFarm
      tags: [farms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
  /farms/{id}:
    patch:
      operationId: updateFarm
      tags: [farms]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
  /products:
    get:
      operationId: listProducts
      tags: [products]
      responses:
        "200":
          description: Products visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }

  # ------------------------------------------------------------------ lots
  /lots:
    get:
      operationId: listLots
      tags: [lots]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/LotStatus" } }
      responses:
        "200":
          description: Lots visible to the caller (farmer = own, admin = all)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LotSummary" }
    post:
      operationId: createLot
      tags: [lots]
      summary: Create a lot, its LOT_CREATED event and its first QR identity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLotBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LotDetail" }
  /lots/{id}:
    get:
      operationId: getLot
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Lot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LotDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateLot
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLotBody" }
      responses:
        "200":
          description: Updated (LOT_UPDATED event appended)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LotDetail" }
  /inventory:
    get:
      operationId: getInventory
      tags: [lots]
      summary: Live inventory per lot with totals (farmer = own lots, admin = all)
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryReport" }
  /lots/{id}/listing:
    post:
      operationId: setLotListing
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LotListingBody" }
      responses:
        "200":
          description: Listing updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LotDetail" }
  /lots/{id}/events:
    get:
      operationId: listLotEvents
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Full (private) event history of the lot, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TraceEvent" }
    post:
      operationId: recordLotEvent
      tags: [lots]
      summary: Farmer records a real-world event. Idempotent on clientEventId.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: X-Offline-Replay
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordLotEventBody" }
      responses:
        "201":
          description: Event appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceEvent" }
        "200":
          description: Duplicate clientEventId, original event returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceEvent" }
        "409": { $ref: "#/components/responses/Error" }
  /lots/{id}/storage:
    get:
      operationId: listLotStorage
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Farmer-managed storage records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StorageRecord" }
  /lots/{id}/qr:
    get:
      operationId: listLotQrCodes
      tags: [qr]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: QR history of the lot (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QrCode" }

  # ------------------------------------------------------------------ qr
  /qr/generate:
    post:
      operationId: generateQr
      tags: [qr]
      summary: Issue a replacement QR for a lot (old ACTIVE QR becomes REPLACED)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateQrBody" }
      responses:
        "201":
          description: New active QR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrCode" }
  /qr/revoke:
    post:
      operationId: revokeQr
      tags: [qr]
      summary: Admin revokes a QR (compromised label). The lot keeps its identity and history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeQrBody" }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrCode" }

  # ------------------------------------------------------------------ public trace
  /trace/{publicToken}:
    get:
      operationId: getPublicTrace
      tags: [trace]
      summary: Public, unauthenticated, rate-limited lot verification
      parameters:
        - { name: publicToken, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Verified lot with public timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTrace" }
        "404": { $ref: "#/components/responses/Error" }
        "410":
          description: QR revoked or replaced; no lot data disclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceUnavailable" }
  /public/overview:
    get:
      operationId: getPublicOverview
      tags: [trace]
      summary: Public landing-page aggregates and one featured public lot (live database values, cached 30 s)
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOverview" }
  /scans:
    post:
      operationId: recordScan
      tags: [trace]
      summary: Record a QR scan (idempotent on clientEventId)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordScanBody" }
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResult" }
  /me/scans:
    get:
      operationId: listMyScans
      tags: [trace]
      responses:
        "200":
          description: Lots recently scanned by the signed-in user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MyScan" }

  # ------------------------------------------------------------------ marketplace
  /marketplace/listings:
    get:
      operationId: listMarketplace
      tags: [marketplace]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200":
          description: Listed lots with available quantity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }
  /marketplace/listings/{lotId}:
    get:
      operationId: getListing
      tags: [marketplace]
      parameters:
        - { name: lotId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404": { $ref: "#/components/responses/Error" }
  /farmers/{id}:
    get:
      operationId: getPublicFarmer
      tags: [marketplace]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Public farmer profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicFarmer" }
        "404": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ orders
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
      responses:
        "200":
          description: Orders visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Customer places an order; inventory is reserved in the same transaction
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "200":
          description: Duplicate Idempotency-Key; existing order returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409": { $ref: "#/components/responses/Error" }
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Order with its event history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/Error" }
  /orders/{id}/{action}:
    post:
      operationId: transitionOrder
      tags: [orders]
      summary: |
        Order state transitions. Farmer: accept, reject, prepare, ready, dispatch, complete.
        Customer: cancel (PENDING/ACCEPTED), confirm-receipt. Admin: cancel, confirm-receipt (with reason).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: action
          in: path
          required: true
          schema: { $ref: "#/components/schemas/OrderAction" }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 100 }
        - name: X-Offline-Replay
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderTransitionBody" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409": { $ref: "#/components/responses/Error" }
  /orders/{id}/feedback:
    post:
      operationId: submitOrderFeedback
      tags: [orders]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackBody" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  # ------------------------------------------------------------------ dashboards
  /dashboard/overview:
    get:
      operationId: getAdminOverview
      tags: [dashboard]
      responses:
        "200":
          description: Admin command-center metrics (live database values)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /dashboard/farmer:
    get:
      operationId: getFarmerOverview
      tags: [dashboard]
      responses:
        "200":
          description: Farmer metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmerOverview" }
  /dashboard/customer:
    get:
      operationId: getCustomerOverview
      tags: [dashboard]
      responses:
        "200":
          description: Customer metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOverview" }

  # ------------------------------------------------------------------ alerts
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [open, all] }
      responses:
        "200":
          description: Alerts (admin = all, farmer = own)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }
  /alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      tags: [alerts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
  /alerts/{id}/resolve:
    post:
      operationId: resolveAlert
      tags: [alerts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }

  # ------------------------------------------------------------------ external data
  /market-prices:
    get:
      operationId: getMarketPrices
      tags: [external]
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90 } }
      responses:
        "200":
          description: Stored external mandi price observations (never fabricated)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketPrices" }
  /weather:
    get:
      operationId: getWeather
      tags: [external]
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Latest stored weather observation for the farm location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherReport" }
  /admin/integrations:
    get:
      operationId: listIntegrations
      tags: [external]
      responses:
        "200":
          description: External data source status and ingestion lineage
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationStatus" }
  /admin/integrations/{source}/run:
    post:
      operationId: runIntegration
      tags: [external]
      parameters:
        - name: source
          in: path
          required: true
          schema: { type: string, enum: [datagov_mandi_daily, open_meteo_current, pau_potato_punjab, faostat_potato_india] }
      responses:
        "200":
          description: Run finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionRun" }

  /me/notifications:
    get:
      operationId: listNotifications
      tags: [auth]
      responses:
        "200":
          description: Own in-app notifications (newest first)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
  /me/notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkReadBody" }
      responses:
        "204": { description: Marked read }
  /me/resubmit:
    post:
      operationId: resubmitApplication
      tags: [auth]
      summary: Farmer resubmits the application after a correction request
      responses:
        "200":
          description: Back in review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/farmers/{id}/review:
    get:
      operationId: getFarmerReview
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Everything an admin needs to review a farmer application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmerReview" }
  /analytics/qr:
    get:
      operationId: getQrAnalytics
      tags: [qr]
      summary: QR scan analytics (admin = all lots, farmer = own lots)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90 } }
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrAnalytics" }
  /admin/anomalies:
    get:
      operationId: listQrAnomalies
      tags: [qr]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, INVESTIGATING, DISMISSED, CONFIRMED] }
      responses:
        "200":
          description: Potential QR anomalies (signals for review, not verdicts)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QrAnomaly" }
  /admin/anomalies/{id}/{action}:
    post:
      operationId: handleQrAnomaly
      tags: [qr]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [investigate, dismiss, confirm] }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnomalyNoteBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrAnomaly" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/qr/{id}/disable:
    post:
      operationId: disableQr
      tags: [qr]
      summary: Temporarily disable an ACTIVE QR (reversible)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QrReasonBody" }
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrCode" }
  /admin/qr/{id}/enable:
    post:
      operationId: enableQr
      tags: [qr]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QrReasonBody" }
      responses:
        "200":
          description: Re-enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrCode" }
  /admin/lots/{id}/recall-impact:
    get:
      operationId: previewLotRecall
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: What a recall would affect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecallImpact" }
  /admin/lots/{id}/recall:
    post:
      operationId: recallLot
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecallBody" }
      responses:
        "200":
          description: Recalled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recall" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/lots/{id}/recall/clear:
    post:
      operationId: clearLotRecall
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClearRecallBody" }
      responses:
        "200":
          description: Recall cleared (the lot stays unlisted until the farmer relists it)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recall" }
  /lots/{id}/recall:
    get:
      operationId: getLotRecall
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Latest recall for the lot, or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Recall"
                  - type: "null"
  /admin/reviews:
    get:
      operationId: listReviews
      tags: [admin]
      responses:
        "200":
          description: Reviews for moderation (including hidden)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModerationReview" }
  /admin/reviews/{orderId}/{action}:
    post:
      operationId: moderateReview
      tags: [admin]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [hide, restore] }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerateReviewBody" }
      responses:
        "204": { description: Done }
        "409": { $ref: "#/components/responses/Error" }

  /reference/punjab-potato:
    get:
      operationId: getPunjabPotato
      tags: [external]
      summary: Punjab potato area, production and yield by district (PAU page citing the Punjab Department of Horticulture)
      responses:
        "200":
          description: Cited statistics with source, period and freshness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PunjabPotato" }
  /reference/faostat-potato-india:
    get:
      operationId: getFaostatIndia
      tags: [external]
      summary: Historical India potato series from FAOSTAT (national level only)
      responses:
        "200":
          description: Historical series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaostatIndia" }
  /market/reference:
    get:
      operationId: getMarketReference
      tags: [external]
      summary: Latest available mandi observation for a district and Punjab (daily data, not real-time)
      parameters:
        - { name: district, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Market reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketReference" }
  /data/sources:
    get:
      operationId: listDataSources
      tags: [external]
      summary: Registry and health of every external source
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationStatus" }

components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details: {}
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    UserRole: { type: string, enum: [admin, farmer, customer] }
    UserStatus: { type: string, enum: [pending, correction_required, active, rejected, suspended] }
    FarmerProfile:
      type: object
      required: [publicName]
      properties:
        publicName: { type: string }
        bio: { type: [string, "null"] }
        village: { type: [string, "null"] }
        district: { type: [string, "null"] }
        state: { type: [string, "null"] }
        verifiedAt: { type: [string, "null"], format: date-time }
        reviewNote: { type: [string, "null"] }
    CurrentUser:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        location: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        farmerProfile:
          oneOf:
            - $ref: "#/components/schemas/FarmerProfile"
            - type: "null"
    FarmerProfileInput:
      type: object
      required: [publicName]
      additionalProperties: false
      properties:
        publicName: { type: string, minLength: 2, maxLength: 120 }
        bio: { type: string, maxLength: 1000 }
        village: { type: string, maxLength: 120 }
        district: { type: string, maxLength: 120 }
        state: { type: string, maxLength: 120 }
    RegisterUserBody:
      type: object
      required: [name, email, password, role]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 200 }
        role: { type: string, enum: [farmer, customer] }
        phone: { type: string, maxLength: 30 }
        location: { type: string, maxLength: 200 }
        farmerProfile: { $ref: "#/components/schemas/FarmerProfileInput" }
    LoginUserBody:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 200 }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/CurrentUser" }
    UpdateProfileBody:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, maxLength: 30 }
        location: { type: string, maxLength: 200 }
        farmerProfile: { $ref: "#/components/schemas/FarmerProfileInput" }
    ReviewUserBody:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 1000 }
    AuditLog:
      type: object
      required: [id, action, entityType, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: [string, "null"] }
        userName: { type: [string, "null"] }
        role: { type: [string, "null"] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, "null"] }
        before: {}
        after: {}
        requestId: { type: [string, "null"] }
        eventId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    Farm:
      type: object
      required: [id, farmerId, name, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        farmerName: { type: [string, "null"] }
        name: { type: string }
        village: { type: [string, "null"] }
        district: { type: [string, "null"] }
        state: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        sizeHectares: { type: [number, "null"] }
        soilType: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    FarmBody:
      type: object
      required: [name, state]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        village: { type: string, maxLength: 120 }
        district: { type: string, maxLength: 120 }
        state: { type: string, minLength: 2, maxLength: 120 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        sizeHectares: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        soilType: { type: string, maxLength: 120 }
    Product:
      type: object
      required: [id, farmerId, name, variety, unit, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        name: { type: string }
        variety: { type: string }
        description: { type: [string, "null"] }
        unit: { type: string }
        createdAt: { type: string, format: date-time }
    ProductBody:
      type: object
      required: [name, variety]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        variety: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        unit: { type: string, enum: [kg, quintal, tonne] }

    LotStatus:
      type: string
      enum: [CREATED, GROWING, HARVESTED, AVAILABLE, RESERVED, PARTIALLY_SOLD, SOLD_OUT]
    QualityGrade: { type: string, enum: [A, B, C] }
    Inventory:
      type: object
      required: [harvested, reserved, sold, loss, available, unit]
      properties:
        harvested: { type: number }
        reserved: { type: number }
        sold: { type: number }
        loss: { type: number }
        available: { type: number }
        unit: { type: string }
    InventoryLine:
      type: object
      required: [lotId, lotCode, productName, variety, status, listed, inventory]
      properties:
        lotId: { type: string, format: uuid }
        lotCode: { type: string }
        productName: { type: string }
        variety: { type: string }
        farmerName: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/LotStatus" }
        listed: { type: boolean }
        inventory: { $ref: "#/components/schemas/Inventory" }
    InventoryReport:
      type: object
      required: [totals, lots, generatedAt]
      properties:
        totals:
          type: object
          required: [harvested, reserved, sold, loss, available]
          properties:
            harvested: { type: number }
            reserved: { type: number }
            sold: { type: number }
            loss: { type: number }
            available: { type: number }
        lots: { type: array, items: { $ref: "#/components/schemas/InventoryLine" } }
        generatedAt: { type: string, format: date-time }
        note: { type: string, description: "Totals mix units only if lots use different units; each line carries its own unit" }
    RiskAssessment:
      type: object
      required: [level, score, reasons, evaluatedAt, engine]
      properties:
        level: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        score: { type: integer }
        reasons: { type: array, items: { type: string } }
        evaluatedAt: { type: string, format: date-time }
        engine: { type: string, description: "Rule-based engine identifier and version (no ML model)" }
    LotSummary:
      type: object
      required: [id, lotCode, productName, variety, farmId, farmName, farmerId, status, listed, recalled, inventory, origin, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        lotCode: { type: string }
        productId: { type: string, format: uuid }
        productName: { type: string }
        variety: { type: string }
        farmId: { type: string, format: uuid }
        farmName: { type: string }
        farmerId: { type: string, format: uuid }
        farmerName: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/LotStatus" }
        listed: { type: boolean }
        recalled: { type: boolean }
        pricePerUnit: { type: [number, "null"] }
        qualityGrade:
          oneOf:
            - $ref: "#/components/schemas/QualityGrade"
            - type: "null"
        harvestDate: { type: [string, "null"] }
        inventory: { $ref: "#/components/schemas/Inventory" }
        origin: { type: string }
        activeQr:
          oneOf:
            - $ref: "#/components/schemas/QrCode"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LotDetail:
      allOf:
        - $ref: "#/components/schemas/LotSummary"
        - type: object
          required: [risk, completeness, scanStats]
          properties:
            completeness: { $ref: "#/components/schemas/Completeness" }
            latestQuality:
              oneOf:
                - $ref: "#/components/schemas/QualityRecord"
                - type: "null"
            scanStats:
              type: object
              required: [verifiedScans, uniqueScanners]
              properties:
                verifiedScans: { type: integer }
                uniqueScanners: { type: integer }
            plantingDate: { type: [string, "null"] }
            expectedHarvestDate: { type: [string, "null"] }
            qualityNotes: { type: [string, "null"] }
            publicNotes: { type: [string, "null"] }
            privateNotes: { type: [string, "null"] }
            risk: { $ref: "#/components/schemas/RiskAssessment" }
            latestStorage:
              oneOf:
                - $ref: "#/components/schemas/StorageRecord"
                - type: "null"
            estimatedMarketValue:
              oneOf:
                - $ref: "#/components/schemas/IndicativeValue"
                - type: "null"
    IndicativeValue:
      type: object
      required: [amount, currency, basis, observationDate, market, label]
      properties:
        amount: { type: number }
        currency: { type: string }
        basis: { type: string }
        observationDate: { type: string }
        market: { type: string }
        label: { type: string }
    CreateLotBody:
      type: object
      required: [farmId, origin]
      additionalProperties: false
      properties:
        farmId: { type: string, format: uuid }
        productId: { type: string, format: uuid, description: "Existing product; or pass productName + variety" }
        productName: { type: string, minLength: 2, maxLength: 80 }
        variety: { type: string, minLength: 1, maxLength: 80 }
        unit: { type: string, enum: [kg, quintal, tonne] }
        plantingDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        expectedHarvestDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        harvestDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        harvestQuantity: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
        qualityGrade: { $ref: "#/components/schemas/QualityGrade" }
        qualityNotes: { type: string, maxLength: 1000 }
        origin: { type: string, minLength: 2, maxLength: 200 }
        publicNotes: { type: string, maxLength: 1000 }
        privateNotes: { type: string, maxLength: 2000 }
        storage: { $ref: "#/components/schemas/StorageInput" }
        clientEventId: { type: string, format: uuid }
    UpdateLotBody:
      type: object
      additionalProperties: false
      properties:
        plantingDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        expectedHarvestDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        publicNotes: { type: string, maxLength: 1000 }
        privateNotes: { type: string, maxLength: 2000 }
        origin: { type: string, minLength: 2, maxLength: 200 }
    LotListingBody:
      type: object
      required: [listed]
      additionalProperties: false
      properties:
        listed: { type: boolean }
        pricePerUnit: { type: number, minimum: 0, maximum: 10000000 }
    StorageInput:
      type: object
      required: [storageType, storageLocation, storageStart]
      additionalProperties: false
      properties:
        storageType: { type: string, enum: [on_farm_shed, cold_storage, warehouse, ambient, other] }
        storageLocation: { type: string, minLength: 2, maxLength: 200 }
        storageStart: { type: string, format: date-time }
        storageEnd: { type: string, format: date-time }
        temperatureC: { type: number, minimum: -30, maximum: 60 }
        humidityPct: { type: number, minimum: 0, maximum: 100 }
        storageCondition: { type: string, enum: [good, fair, poor] }
        notes: { type: string, maxLength: 1000 }
    StorageRecord:
      type: object
      required: [id, lotId, storageType, storageLocation, storageStart, createdAt]
      properties:
        id: { type: string, format: uuid }
        lotId: { type: string, format: uuid }
        storageType: { type: string }
        storageLocation: { type: string }
        storageStart: { type: string, format: date-time }
        storageEnd: { type: [string, "null"], format: date-time }
        temperatureC: { type: [number, "null"] }
        humidityPct: { type: [number, "null"] }
        storageCondition: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    FarmerEventType:
      type: string
      enum:
        [GROWING_RECORDED, HARVEST_RECORDED, QUALITY_RECORDED, STORAGE_RECORDED, LOSS_RECORDED, SPOILAGE_RECORDED, CORRECTION_RECORDED]
    RecordLotEventBody:
      type: object
      required: [eventType, clientEventId]
      additionalProperties: false
      properties:
        eventType: { $ref: "#/components/schemas/FarmerEventType" }
        clientEventId: { type: string, format: uuid }
        eventTime: { type: string, format: date-time, description: "When it happened in the real world (defaults to now)" }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
        harvestAdjustment: { type: number, minimum: -100000000, maximum: 100000000, description: "CORRECTION_RECORDED only" }
        qualityGrade: { $ref: "#/components/schemas/QualityGrade" }
        appearance: { type: string, maxLength: 300 }
        sizeCategory: { type: string, enum: [small, medium, large, mixed] }
        defects: { type: string, maxLength: 500 }
        inspectionDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        reason: { type: string, maxLength: 1000 }
        location: { type: string, maxLength: 200 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        correctsEventId: { type: string, format: uuid }
        storage: { $ref: "#/components/schemas/StorageInput" }
    ScanAreas:
      type: object
      required: [gridDegrees, approxCellKm, days, okScans, scansWithSharedLocation, cells]
      properties:
        gridDegrees: { type: number }
        approxCellKm: { type: integer }
        days: { type: integer }
        okScans: { type: integer, description: Successful scans in the window }
        scansWithSharedLocation: { type: integer, description: Of those, how many the scanner chose to locate }
        cells:
          type: array
          items:
            type: object
            required: [lat, lon, scans, scanners, lots, lastScanAt]
            properties:
              lat: { type: number, description: Cell centre }
              lon: { type: number, description: Cell centre }
              scans: { type: integer }
              scanners: { type: integer, description: Distinct anonymous browser sessions }
              lots: { type: integer }
              lastScanAt: { type: string, format: date-time }
              label: { type: [string, "null"], description: Most common coarse place name given by scanners, if any }
    TraceEvent:
      type: object
      required: [id, lotId, eventType, eventTime, recordedAt, source, metadata]
      properties:
        id: { type: string, format: uuid }
        lotId: { type: string, format: uuid }
        lotCode: { type: string }
        orderId: { type: [string, "null"] }
        eventType: { type: string }
        eventTime: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        actorUserId: { type: [string, "null"] }
        actorName: { type: [string, "null"] }
        actorRole: { type: [string, "null"] }
        location: { type: [string, "null"] }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        quantityBefore: { type: [number, "null"] }
        quantityChange: { type: [number, "null"] }
        quantityAfter: { type: [number, "null"] }
        status: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        source: { type: string }
        clientEventId: { type: [string, "null"] }
        previousEventId: { type: [string, "null"] }
        correctsEventId: { type: [string, "null"] }
        isPublic: { type: boolean }
        metadata: { type: object, additionalProperties: true }

    QrStatus: { type: string, enum: [ACTIVE, REVOKED, REPLACED, DISABLED] }
    QrCode:
      type: object
      required: [id, lotId, version, status, traceUrl, publicToken, createdAt]
      properties:
        id: { type: string, format: uuid }
        lotId: { type: string, format: uuid }
        version: { type: integer }
        status: { $ref: "#/components/schemas/QrStatus" }
        publicToken: { type: string }
        traceUrl: { type: string, description: "The only content encoded in the QR image" }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        revokeReason: { type: [string, "null"] }
        replacedById: { type: [string, "null"] }
    GenerateQrBody:
      type: object
      required: [lotId, reason]
      additionalProperties: false
      properties:
        lotId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
    RevokeQrBody:
      type: object
      required: [qrId, reason]
      additionalProperties: false
      properties:
        qrId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
        issueReplacement: { type: boolean }

    PublicTimelineEntry:
      type: object
      required: [eventType, label, eventTime]
      properties:
        eventType: { type: string }
        label: { type: string }
