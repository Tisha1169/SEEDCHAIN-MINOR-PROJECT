# Render Blueprint: one Docker web service (API + built SPA) and one PostgreSQL database.
# Free plans are for testing only: the free web service sleeps when idle and the free
# database is deleted after 30 days. Switch both `plan:` values to a paid plan for the pilot.
databases:
  - name: seedchain-db
    plan: free
    databaseName: seedchain
    user: seedchain

services:
  - type: web
    name: seedchain-tisha
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: seedchain-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: PUBLIC_TRACE_BASE_URL
        value: https://seedchain-tisha.onrender.com
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      # Optional, add in the dashboard when you have a key: DATA_GOV_IN_API_KEY
