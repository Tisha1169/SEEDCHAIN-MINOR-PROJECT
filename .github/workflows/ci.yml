name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: seedchain, POSTGRES_PASSWORD: seedchain, POSTGRES_DB: seedchain_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seedchain" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://seedchain:seedchain@localhost:5432/seedchain_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Tests (unit, integration, acceptance, negative)
        run: pnpm test
      - name: Generated API client is up to date
        run: |
          pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts
          git diff --exit-code lib/api-client-react lib/api-zod
      - name: Production build
        run: pnpm run build
      - name: Docker image builds
        run: docker build -t seedchain:ci .
